# E7c (CONTROL): full JnJ test, no base filter — reproduces E6 on the current code path.
# Purpose: an in-batch reference so E7a/E7b (carbonate-restricted) are compared against the SAME
#   code, not just the E6 numbers. Expected (from E6): corr08 ~0.723, cond_only ~0.321,
#   corr08+cond ~0.340 (conditions crash in transfer because P/U/test occupy different base regimes;
#   see docs/decisions/007-...).
# sbatch scripts_JSP/pubench_run.sbatch configs/pu_bench.e7c.yaml

data:
  root: final_datasets
  positives: merged

seed: 0
threshold_strategy: val_youden
out_dir: artifacts/pubench/e7c

featurizers:
  - name: reduced_ecfp
    label: corr08
    params: { n_bits: 2048, use_conditions: false, method: correlation, min_freq: 0.01, corr_threshold: 0.8 }
  - name: condition_descriptors
    label: cond_only
    params: { ligand_cache: datasets/processed/features/ligand_descriptors.parquet }
  - name: composite
    label: corr08+cond
    params:
      components:
        - { name: reduced_ecfp, params: { n_bits: 2048, use_conditions: false, method: correlation, min_freq: 0.01, corr_threshold: 0.8 } }
        - { name: condition_descriptors, params: { ligand_cache: datasets/processed/features/ligand_descriptors.parquet } }

models:
  - name: supervised
    label: sup_histgb_l2
    params: { base: histgb, iterations: 400, learning_rate: 0.05, l2_regularization: 1.0 }
