# E4: feature comparison — ECFP(subs-only) vs DRFP(reaction) vs ECFP(subs+cond) — with the
# strong nonlinear models. Tests whether a reaction fingerprint transfers better than substrate ECFP.
# sbatch --partition=CPU scripts_JSP/pubench_run.sbatch configs/pu_bench.e4.yaml

data:
  root: final_datasets
  positives: merged

seed: 0
threshold_strategy: val_youden
out_dir: artifacts/pubench/e4

featurizers:
  - name: ecfp
    label: ecfp_subs_only
    params: { radius: 2, n_bits: 2048, use_conditions: false }
  - name: drfp
    label: drfp_reaction
    params: { n_bits: 2048, radius: 3 }
  - name: ecfp
    label: ecfp_subs_cond
    params: { radius: 2, n_bits: 2048, use_conditions: true }

models:
  - name: supervised
    params: { iterations: 300, depth: 6 }
  - name: bagging_pu
    params: { n_estimators: 15, max_iter: 200 }
  - name: elkan_noto
    params: { max_iter: 300 }
  - name: spy
    params: { iterations: 200, depth: 6 }
