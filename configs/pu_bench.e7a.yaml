# E7a (test-restricted): evaluate the CURRENT full-data model on the in-distribution-condition
#   subset of JnJ (carbonate base only). P and U stay FULL ("normal P"); only val/test are
#   restricted to carbonate (cond_base_key == BVKZGUZCCUSVTD — the one base that overlaps the
#   literature corpus, 49.7% of P vs 18.8% of test; P2-Et/HMDS/silanolate are ~0% in P by design).
# Question: is the substrate model (0.72 on full test) actually BETTER on the carbonate test, where
#   its implicit "carbonate-positive" signal aligns with the label? And do conditions still crash
#   here (they should — P/U still span all bases, so the P-vs-U condition domain tag persists)?
# Carbonate test n=360 (128 pos / 232 neg); val n=448. Small — read ROC-AUC with that in mind.
# sbatch scripts_JSP/pubench_run.sbatch configs/pu_bench.e7a.yaml

data:
  root: final_datasets
  positives: merged
  base_filter:
    keys: [BVKZGUZCCUSVTD]   # carbonate (Cs2CO3 / K2CO3 anion; ADR-007 in-distribution base)
    apply_to: [val, test]

seed: 0
threshold_strategy: val_youden
out_dir: artifacts/pubench/e7a

featurizers:
  - name: reduced_ecfp
    label: corr08
    params: { n_bits: 2048, use_conditions: false, method: correlation, min_freq: 0.01, corr_threshold: 0.8 }
  - name: condition_descriptors
    label: cond_only
    params: { ligand_cache: datasets/processed/features/ligand_descriptors.parquet }
  - name: composite
    label: corr08+cond
    params:
      components:
        - { name: reduced_ecfp, params: { n_bits: 2048, use_conditions: false, method: correlation, min_freq: 0.01, corr_threshold: 0.8 } }
        - { name: condition_descriptors, params: { ligand_cache: datasets/processed/features/ligand_descriptors.parquet } }

models:
  - name: supervised
    label: sup_histgb_l2
    params: { base: histgb, iterations: 400, learning_rate: 0.05, l2_regularization: 1.0 }
