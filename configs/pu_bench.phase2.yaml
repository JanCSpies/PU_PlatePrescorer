# Phase-2 PU benchmark: {substrate+condition, substrate-only} ECFP x
# {supervised, spy, nnPU, IW-PU}. Run:
#   uv run python -m pubench.cli --config configs/pu_bench.phase2.yaml
# Heavy (CatBoost + density-ratio on ~64k x 10243); prefer a background run or SLURM.

data:
  root: final_datasets
  positives: merged

seed: 0
threshold_strategy: val_youden
out_dir: artifacts/pubench/phase2

featurizers:
  - name: ecfp
    label: ecfp_subs_cond
    params: { radius: 2, n_bits: 2048, use_conditions: true }
  - name: ecfp
    label: ecfp_subs_only
    params: { radius: 2, n_bits: 2048, use_conditions: false }

models:
  - name: supervised          # naive lower bound (U as negative)
    params: { iterations: 300, depth: 6 }
  - name: spy                 # PAYN-style reliable-negative baseline
    params: { iterations: 200, depth: 6, spy_fraction: 0.15 }
  - name: nnpu                # non-negative PU risk
    params: { prior: 0.32, epochs: 200, learning_rate: 0.05 }   # prior = val base rate
  - name: iw_pu               # density-ratio importance-weighted PU (RuLSIF)
    params: { prior: 0.32, epochs: 200, density_ratio: rulsif }
