# E7b (fully aligned): restrict ALL splits to the carbonate base regime — "carbonate P" + carbonate
#   U + carbonate test. This is the direct test of ADR-007's hypothesis: conditions crash transfer
#   ONLY because P/U/test live in different base regions (condition axis = domain tag). Align them
#   and the tag disappears, so adding conditions (ligand/solvent descriptors; base is now constant)
#   should stop hurting and may finally help.
# Sizes after filter: P 31,845 (was 64,061) | U 9,206 (was 52,736) | val 448 | test 360.
# Compare to E7a (same carbonate test, but FULL P/U): E7a vs E7b = "normal P" vs "carbonate P".
#   - corr08 (subs-only): does matching the training condition regime help the substrate model?
#   - corr08+cond: do in-distribution conditions beat subs-only here, unlike the E6/E7c crash?
# sbatch scripts_JSP/pubench_run.sbatch configs/pu_bench.e7b.yaml

data:
  root: final_datasets
  positives: merged
  base_filter:
    keys: [BVKZGUZCCUSVTD]   # carbonate — applied to every split (P, U, val, test)
    apply_to: [P, U, val, test]

seed: 0
threshold_strategy: val_youden
out_dir: artifacts/pubench/e7b

featurizers:
  - name: reduced_ecfp
    label: corr08
    params: { n_bits: 2048, use_conditions: false, method: correlation, min_freq: 0.01, corr_threshold: 0.8 }
  - name: condition_descriptors
    label: cond_only
    params: { ligand_cache: datasets/processed/features/ligand_descriptors.parquet }
  - name: composite
    label: corr08+cond
    params:
      components:
        - { name: reduced_ecfp, params: { n_bits: 2048, use_conditions: false, method: correlation, min_freq: 0.01, corr_threshold: 0.8 } }
        - { name: condition_descriptors, params: { ligand_cache: datasets/processed/features/ligand_descriptors.parquet } }

models:
  - name: supervised
    label: sup_histgb_l2
    params: { base: histgb, iterations: 400, learning_rate: 0.05, l2_regularization: 1.0 }
