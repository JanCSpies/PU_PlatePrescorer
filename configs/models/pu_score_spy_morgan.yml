# Stage S2b, the final fit. Spy arm, SECONDARY block (docs/design/modeling.md "S2b"; ADR 028, ADR 029).
# Every value here is hashed into every score row, by value and not by file (`config_sha256`).
#
# The spy arm is the PRIMARY method (ADR 014 item 1) and stays so whatever the naive arm scores. If
# the naive arm wins, that is reported as "the choice of PU method changed the answer by X", not as
# a substitution; Luka kept ADR 014 item 1 on 2026-11-02, before any validation read.
model: pair_hgb_spy
# `morgan` is the secondary block; `morgan_centre` stays primary (ADR 014 item 2). Read this run
# knowing two measured things that pull apart: `morgan` separates literature substrates from lab
# ones at 0.859 and 0.879 (ADR 012 item 2, ADR 018) and the plate scores LAB substrates, while it is
# also the better block at telling a reported success from a reported near-miss, 0.686 against 0.583
# (ADR 027). Luka weighed those on 2026-11-02 and kept morgan_centre primary.
#
# It must agree with the S2a config named below, because the reliable negatives it trains on were
# cut under that block, and the script refuses the pair if it does not.
feature_block: morgan
# The class width, 11,396 positives (ADR 008 item 8). Not the HATU family.
p_width: all
unlabeled: unlabeled_literature_k10
# **The arm.** This names the S2a config whose <stem>.negatives.parquet supplies the negative class.
# The run of 2026-11-02 cut 14,031 reliable negatives under it, 0.1373 of U's rows and 0.1355 of its
# draws. `null` here would be the naive arm instead.
negatives: pu_spy_morgan
learner: HistGradientBoostingClassifier
learner_params:
  # Must match the S2a config's exactly, or the script refuses the pointer: a model fitted under
  # different learner settings than the ones that chose its negatives is two experiments in one.
  max_iter: 200
  early_stopping: false
seed: 20261102
