data:
  positives: merged
  root: final_datasets
featurizers:
- label: ecfp_subs_only
  name: ecfp
  params:
    n_bits: 2048
    radius: 2
    use_conditions: false
models:
- label: sup_catboost
  name: supervised
  params:
    base: catboost
    depth: 6
    iterations: 300
- label: sup_histgb
  name: supervised
  params:
    base: histgb
    iterations: 300
    learning_rate: 0.1
- label: sup_histgb_l2
  name: supervised
  params:
    base: histgb
    iterations: 400
    l2_regularization: 1.0
    learning_rate: 0.05
- label: sup_histgb_shallow
  name: supervised
  params:
    base: histgb
    iterations: 400
    l2_regularization: 1.0
    learning_rate: 0.05
    max_leaf_nodes: 15
- label: bagging25
  name: bagging_pu
  params:
    learning_rate: 0.05
    max_iter: 300
    n_estimators: 25
- label: elkan
  name: elkan_noto
  params:
    learning_rate: 0.1
    max_iter: 300
out_dir: artifacts/pubench/e5
seed: 0
threshold_strategy: val_youden
