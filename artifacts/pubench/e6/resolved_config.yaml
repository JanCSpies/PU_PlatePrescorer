data:
  positives: merged
  root: final_datasets
featurizers:
- label: svd256
  name: reduced_ecfp
  params:
    method: svd
    n_bits: 2048
    n_components: 256
    standardize: true
    use_conditions: false
- label: corr08
  name: reduced_ecfp
  params:
    corr_threshold: 0.8
    method: correlation
    min_freq: 0.01
    n_bits: 2048
    use_conditions: false
- label: cond_only
  name: condition_descriptors
  params:
    ligand_cache: datasets/processed/features/ligand_descriptors.parquet
- label: svd256+cond
  name: composite
  params:
    components:
    - name: reduced_ecfp
      params:
        method: svd
        n_bits: 2048
        n_components: 256
        standardize: true
        use_conditions: false
    - name: condition_descriptors
      params:
        ligand_cache: datasets/processed/features/ligand_descriptors.parquet
- label: corr08+cond
  name: composite
  params:
    components:
    - name: reduced_ecfp
      params:
        corr_threshold: 0.8
        method: correlation
        min_freq: 0.01
        n_bits: 2048
        use_conditions: false
    - name: condition_descriptors
      params:
        ligand_cache: datasets/processed/features/ligand_descriptors.parquet
models:
- label: sup_histgb_l2
  name: supervised
  params:
    base: histgb
    iterations: 400
    l2_regularization: 1.0
    learning_rate: 0.05
- label: elkan
  name: elkan_noto
  params:
    learning_rate: 0.1
    max_iter: 300
- label: iw_pu
  name: iw_pu
  params:
    density_ratio: rulsif
    epochs: 200
    prior: 0.32
    project_dim: 64
- label: spy
  name: spy
  params: {}
out_dir: artifacts/pubench/e6
seed: 0
threshold_strategy: val_youden
