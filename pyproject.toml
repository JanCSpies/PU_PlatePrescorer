[project]
name = "platepu"
version = "0.1.0"
description = "Literature-PU pre-scoring of HTE substrate plates"
readme = "README.md"
authors = [
    { name = "Luka Praprotnik Čurič", email = "luka.praprotnik54@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
# docs/ holds notes, not project code: ruff must not reformat code snippets in them.
extend-exclude = ["docs"]
