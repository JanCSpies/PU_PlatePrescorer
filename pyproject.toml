[project]
name = "platepu"
version = "0.1.0"
description = "Literature-PU pre-scoring of HTE substrate plates"
readme = "README.md"
authors = [
    { name = "Luka Praprotnik Čurič", email = "luka.praprotnik54@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas>=2.3,<3",
    "pyarrow>=25.0.1",
    "rdkit>=2026.3.6",
    "reaction-utils>=1.9.4",
    "setuptools<81",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs<3",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff.lint]
# C90 = McCabe complexity: at most 10 paths through one function (CLAUDE.md §5).
extend-select = ["C90"]
mccabe.max-complexity = 10
# Sort `import platepu...` as our own code, even for modules that do not exist yet (tests first).
isort.known-first-party = ["platepu"]

[tool.pytest.ini_options]
# Lets tests import exploration scripts in scripts/ (not a package) by module name.
pythonpath = ["scripts"]
