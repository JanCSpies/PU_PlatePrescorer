[project]
name = "bhpu"
version = "0.1.0"
description = "Feasibility prediction of Buchwald-Hartwig C-N couplings from literature data via Positive-Unlabeled learning."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Florian Boser" },
    { name = "Glorius Group, University of Muenster" },
]

# Core scientific stack. Pinned to lower bounds; uv resolves the newest compatible.
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17.0",          # Parquet I/O for processed datasets
    "scipy>=1.14",
    "scikit-learn>=1.5",      # PU baselines, metrics, model selection
    "catboost>=1.2.7",        # Gradient boosting (PAYN's base learner)
    "rdkit>=2024.9.1",        # Cheminformatics: canonicalisation, fingerprints, leakage audit
    "drfp>=0.3.6",            # Differential Reaction FingerPrint (matches dataset's DRFP column)
    "optuna>=4.0",            # Hyperparameter optimisation
    "matplotlib>=3.9",        # Plotting
    "seaborn>=0.13",          # Statistical plots for the demo
    "tqdm>=4.66",             # Progress bars
    "rich>=13.9",             # Structured console output / logging
    "pydantic>=2.9",          # Typed, validated config objects
    "pyyaml>=6.0",            # YAML experiment configs (pubench benchmarking pipeline)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",             # Lint + format (Google docstring convention)
    "mypy>=1.13",            # Static type checking
    "pytest>=8.3",           # Unit tests
    "ipykernel>=6.29",       # Notebook kernel for exploratory analysis
]
# Heavy, torch-backed learners kept optional so the core pipeline stays light.
# Install with:  uv sync --extra models
models = [
    "tabpfn>=2.0",           # Pretrained tabular foundation model (limited-label regime)
    "chemprop>=2.1",         # Directed-MPNN graph model over reaction/molecule SMILES
]
# Semiempirical QM descriptors (GFN2-xTB electronics per substrate) for the WS4 feature arm.
# Install with:  uv sync --extra qm   (or: uv pip install tblite)
qm = [
    "morfeus-ml>=0.8.0",
    "tblite>=0.6",           # GFN2-xTB single-point charges / HOMO-LUMO / dipole via Python bindings
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bhpu", "src/pubench"]

# ---------------------------------------------------------------------------
# Tooling configuration — enforces the project's coding standards:
# modern Python, full typing, Google-style docstrings, OOP.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "scripts"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",              # isort
    "N",              # pep8-naming
    "D",              # pydocstyle
    "UP",             # pyupgrade
    "B",              # flake8-bugbear
    "ANN",            # flake8-annotations (enforce typing)
    "SIM",            # flake8-simplify
    "RUF",            # ruff-specific
]
ignore = [
    "D107",     # __init__ docstring optional (documented at class level)
    "RUF002",   # en dash (–) is correct IUPAC nomenclature (Buchwald–Hartwig, C–N)
    "RUF003",   # same, in comments
    "COM812",   # trailing-comma rule that conflicts with the formatter
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["D103"]          # top-level script functions may omit docstrings
"tests/*" = ["D", "ANN"]
# PU models use the field's standard notation P (positives), U (unlabeled), X (features).
"src/pubench/models/*.py" = ["N803"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = []

# Third-party scientific libraries that do not ship type stubs (py.typed).
# Ignoring their missing imports keeps `mypy --strict` meaningful on our own code.
[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "catboost.*",
    "drfp.*",
    "sklearn.*",
    "optuna.*",
    "matplotlib.*",
    "seaborn.*",
    "tabpfn.*",
    "chemprop.*",
    "tblite.*",
    "morfeus.*",
    "yaml.*",
]
ignore_missing_imports = true

# rdkit ships stubs (rdkit-stubs) but the 2026.03 build has a syntax error in
# rdchem.pyi; skip following its imports so mypy does not choke on the vendored stub.
[[tool.mypy.overrides]]
module = ["rdkit.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

# pyarrow ships partial stubs whose functions are untyped; skip following them so bulk
# parquet streaming in the miner does not trip `no-untyped-call` under --strict.
[[tool.mypy.overrides]]
module = ["pyarrow.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
