[project]
name = "platepu"
version = "0.1.0"
description = "Literature-PU pre-scoring of HTE substrate plates"
readme = "README.md"
authors = [
    { name = "Luka Praprotnik Čurič", email = "luka.praprotnik54@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff.lint]
# C90 = McCabe complexity: at most 10 paths through one function (CLAUDE.md §5).
extend-select = ["C90"]
mccabe.max-complexity = 10
# Sort `import platepu...` as our own code, even for modules that do not exist yet (tests first).
isort.known-first-party = ["platepu"]
